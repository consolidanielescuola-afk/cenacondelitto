<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Homemade+Apple&display=swap"><style id="css">
:root{
  color-scheme: dark;
  --bg:#14110e; --bg2:#1f1a15; --bg3:#2a241d; --line:#40362c;
  --text:#f3ebdd; --muted:#c3b5a3; --faint:#9a8b7a;
  --amber:#f0ad48; --amber-dim:#8a6427;
  --red:#c23a2c; --red-ink:#9e2a1f;
  --paper:#f4ecdc; --paper2:#e6dcc6; --ink:#1f1a14;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"Courier Prime", "Courier New", Courier, monospace;
  --sans:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{background:var(--bg);margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{color:var(--text);font-family:var(--serif);font-size:18px;line-height:1.55;padding-inline:16px;padding-block:0 calc(56px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto}

/* ---------- lucchetto ---------- */
.lockbtn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:max(16px, calc(50% - 240px));z-index:46;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(31,26,21,.92);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.lockbtn svg{width:19px;height:19px}
.lockbtn.on{color:var(--amber);border-color:var(--amber)}

/* ---------- ciak ---------- */
.slate{margin-top:calc(78px + env(safe-area-inset-top,0px));border:1px solid var(--line);background:var(--bg2);border-radius:6px;overflow:hidden}
.clap{height:24px;background:repeating-linear-gradient(-58deg,#f3ebdd 0 20px,#14110e 20px 40px);border-bottom:1px solid var(--line)}
.slate-grid{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.slate-grid div{padding:9px 14px;min-width:0}
.slate-grid div:nth-child(odd){border-right:1px solid var(--line)}
.slate-grid div:nth-child(-n+2){border-bottom:1px solid var(--line)}
.slate-grid small{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.slate-grid b{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--text);display:block;line-height:1.3}
.slate-title{padding:16px 18px 18px}
.eyebrow{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(40px,12.5vw,64px);line-height:.9;letter-spacing:.01em;text-transform:uppercase;margin:8px 0 10px}
.lede{color:var(--muted);margin:0;font-size:18px}
.lede strong{color:var(--text);font-weight:600}
.status{display:flex;flex-direction:column;gap:6px;margin-top:16px;font-family:var(--mono);font-size:15px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:8px;box-shadow:0 0 0 3px rgba(194,58,44,.25);animation:rec 1.6s infinite}
@keyframes rec{50%{opacity:.35}}
.count{color:var(--amber);font-weight:700}

/* ---------- sezioni ---------- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:40px 0 14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.sec-h h2{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.04em;text-transform:uppercase;margin:0;line-height:1}
.sec-h span{font-family:var(--mono);font-size:13px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
details.cast summary{cursor:pointer;list-style:none;min-height:44px}
details.cast summary::-webkit-details-marker{display:none}
details.cast summary .tog{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--amber);letter-spacing:.04em;text-transform:uppercase}
details.cast[open] summary .tog::after{content:" ▴"}
details.cast:not([open]) summary .tog::after{content:" ▾"}
.cast-grid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.person{background:var(--bg2);padding:14px 16px}
.person b{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.03em;text-transform:uppercase;display:block;line-height:1.05}
.person i{font-family:var(--mono);font-style:normal;font-size:14px;font-weight:700;color:var(--amber);letter-spacing:.03em;text-transform:uppercase}
.person p{margin:6px 0 0;font-size:17px;color:var(--muted);line-height:1.5}

/* ---------- scene ---------- */
.scene{padding:24px 0 28px;border-bottom:1px dashed var(--line)}
.scene:last-child{border-bottom:0}
.sc-num{font-family:var(--display);font-weight:900;font-size:52px;line-height:.85;color:var(--amber);display:flex;align-items:baseline;gap:10px}
.sc-num small{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.sc-body h3{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:.03em;text-transform:uppercase;margin:8px 0 16px}
.sc-empty{font-style:italic;color:var(--muted);margin:0;font-size:17px}
.clues{display:grid;gap:14px}

.card{position:relative;text-align:left;border-radius:4px;padding:16px 18px 14px;min-height:120px;display:flex;flex-direction:column;gap:4px;border:0;width:100%}
.card.open{background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35)}
.card.open:active{transform:scale(.985)}
.card.open::before{content:"";position:absolute;top:14px;right:16px;width:12px;height:12px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px var(--paper2)}
.tagno{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--red-ink);font-weight:700}
.card.open .ctitle{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.02;text-transform:uppercase;letter-spacing:.02em;padding-right:24px}
.card.open .ckind{font-family:var(--mono);font-size:15px;color:#5e5144}
.card.open .cgo{margin-top:8px;font-family:var(--mono);font-size:15px;font-weight:700;color:var(--ink);padding-top:10px;border-top:1px dashed #c6b99f}
.new{position:absolute;top:-10px;left:14px;background:var(--amber);color:#1a1208;font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.08em;padding:3px 9px;border-radius:2px;text-transform:uppercase}

.card.locked{background:repeating-linear-gradient(135deg,var(--bg2) 0 10px,#1a1612 10px 20px);border:1px dashed var(--line);color:var(--faint);overflow:hidden;min-height:112px}
.card.locked .tagno{color:var(--faint)}
.tape{position:absolute;left:-20%;right:-20%;top:50%;transform:translateY(-50%) rotate(-6deg);background:var(--red);color:#f8e6da;font-family:var(--display);font-weight:800;letter-spacing:.3em;font-size:17px;text-transform:uppercase;padding:5px 0;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.card.locked .lk-top{position:absolute;top:12px;left:16px}
.card.locked .lk-bot{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:14px;color:var(--muted)}
.card.adminpeek{outline:1px dashed var(--amber-dim);outline-offset:3px;cursor:pointer}

footer.foot{margin-top:36px;font-family:var(--mono);font-size:14px;color:var(--faint);text-align:center;line-height:1.7}

/* ---------- finestra reperto ---------- */
.modal{position:fixed;inset:0;z-index:60;background:#0d0b09;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(40px + env(safe-area-inset-bottom,0px))}
.modal-bar{max-width:480px;margin:0 auto 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5;background:#0d0b09;padding:4px 0 8px}
.modal-bar .tagno{color:var(--amber)}
.modal-bar h4{margin:2px 0 0;font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.xbtn{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);cursor:pointer;font-size:24px;line-height:1;color:var(--text)}
.modal-body{max-width:480px;margin:0 auto}
.hintline{max-width:480px;margin:16px auto 0;font-family:var(--mono);font-size:15px;color:var(--muted);text-align:center;line-height:1.5}

/* ---------- giornale ---------- */
.np{background:#f5f0e4;color:#1a1815;padding:16px 16px 20px;font-family:"Old Standard TT",Georgia,serif;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.np b,.np strong{font-weight:400}
.np-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-bottom:1px solid #1a1815;padding-bottom:4px;font-style:italic}
.np-mast{font-weight:700;font-size:44px;text-align:center;line-height:1;margin:10px 0 4px}
.np-mast em{color:#b0231a;font-style:italic}
.np-motto{text-align:center;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;border-top:3px double #1a1815;border-bottom:3px double #1a1815;padding:5px 0;margin-bottom:14px}
.np-kick{display:inline-block;background:#b0231a;color:#fff;font-size:12.5px;letter-spacing:.12em;padding:3px 9px;text-transform:uppercase}
.np-kick.alt{background:#1a1815}
.np-head{font-size:34px;line-height:1.05;margin:10px 0 8px;font-weight:400}
.np-sub{font-style:italic;font-size:20px;margin:0 0 14px;line-height:1.3}
.np-photo{height:160px;background:repeating-radial-gradient(circle at 30% 40%,#3b362f 0 2px,#8b8375 2px 4px);position:relative;margin-bottom:6px;filter:grayscale(1) contrast(1.1);overflow:hidden}
.np-pic{display:block;width:100%;height:auto;margin-bottom:6px;border:1px solid #1a1815}
.np-lead .np-pic{margin-bottom:8px}
.np-photo.sm{height:90px;margin-bottom:8px}
.np-photo.b{background:repeating-radial-gradient(circle at 70% 30%,#3b362f 0 2px,#9a9284 2px 4px)}
.np-silh{position:absolute;bottom:0;width:80px;height:130px;background:#1a1815;border-radius:40px 40px 6px 6px;opacity:.85}
.np-photo.sm .np-silh{width:40px;height:70px;border-radius:20px 20px 4px 4px}
.np-cap{font-size:14px;font-style:italic;margin-bottom:14px}
.np-cols{font-size:18px;line-height:1.55}
.np-cols p{margin:0 0 12px}
.np-cols p:first-child::first-letter{float:left;font-size:50px;line-height:.9;padding:4px 6px 0 0}
.np-box{margin-top:14px;border:1px solid #1a1815;padding:10px 14px;font-size:17px;line-height:1.5}
.np-box .lbl{display:block;text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:#b0231a}
/* prima pagina */
.np-item{display:block;width:100%;text-align:left;background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;cursor:pointer}
.np-item:active{opacity:.7}
.np-lead{padding-bottom:14px;border-bottom:1px solid #1a1815}
.np-lead .np-head{font-size:32px}
.np-ex{font-size:17px;line-height:1.45;margin:0}
.np-more{display:inline-block;margin-top:8px;font-size:14px;font-style:italic;color:#b0231a;border-bottom:1px solid #b0231a}
.np-row{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #1a1815}
.np-row .np-item{padding:14px 12px 14px 0;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start}
.np-row .np-kick,.np-row .np-more{align-self:flex-start}
.np-row .np-item + .np-item{padding:14px 0 14px 12px;border-left:1px solid #1a1815}
.np-row .np-head{font-size:21px;line-height:1.1;margin:8px 0 6px}
.np-row .np-ex{font-size:15px;line-height:1.4}
.np-game{margin-top:14px;border:2px solid #1a1815;padding:12px 14px;display:flex;gap:14px;align-items:center}
.np-game .np-head{font-size:23px;margin:6px 0 4px}
.np-game .np-ex{font-size:15px}
.np-mini{flex:0 0 auto;width:66px;height:66px;display:grid;grid-template-columns:repeat(3,1fr);border:2px solid #1a1815}
.np-mini i{border:1px solid #1a1815;display:grid;place-items:center;font-style:normal;font-size:13px}
.np-mini i.h{background:#f1c75a}
.np-back{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid #1a1815;border-radius:20px;padding:6px 14px;margin-bottom:14px;color:#1a1815;font-family:inherit;font-size:15px;font-style:italic;cursor:pointer;min-height:40px}
.np-sec{font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid #1a1815;padding-bottom:4px;margin-bottom:12px}
/* sudoku */
.sdk{display:grid;grid-template-columns:repeat(9,1fr);border:3px solid #1a1815;margin:6px 0 10px;user-select:none;-webkit-user-select:none}
.sdk button{aspect-ratio:1;border:0;border-right:1px solid #8b8375;border-bottom:1px solid #8b8375;background:#fbf8f1;color:#2d55a8;font-family:inherit;font-size:21px;padding:0;cursor:pointer;position:relative;min-width:0}
.sdk button:nth-child(9n){border-right:0}
.sdk button:nth-child(9n+3),.sdk button:nth-child(9n+6){border-right:2px solid #1a1815}
.sdk button:nth-child(n+19):nth-child(-n+27),.sdk button:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #1a1815}
.sdk button:nth-child(n+73){border-bottom:0}
.sdk button.g{color:#1a1815;cursor:default}
.sdk button.h{background:#f1c75a}
.sdk button.peer{background:#ece4d2}
.sdk button.h.peer{background:#ebbd45}
.sdk button.sel{background:#c9dbf5}
.sdk button.bad{color:#b0231a}
.sdk button sup{position:absolute;top:1px;left:3px;font-size:9px;color:#1a1815}
.sdk-pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sdk-pad button{height:46px;border:1px solid #1a1815;background:#fbf8f1;color:#1a1815;font-family:inherit;font-size:21px;border-radius:4px;cursor:pointer}
.sdk-pad button.x{font-size:14px;font-style:italic}
.sdk-msg{min-height:22px;margin:10px 0 0;font-size:16px;font-style:italic;text-align:center;color:#b0231a}
.np-rules{font-size:16px;line-height:1.5;margin:0 0 10px}

/* invito videochiamata */
.inv-wrap{border:1px solid #d9d5cc;border-radius:10px;margin:0 0 14px;background:#fff;overflow:hidden}
.inv-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f1f3f4;border-bottom:1px solid #d9d5cc;font-size:13px;font-weight:600;color:#444}
.inv-head svg{width:17px;height:17px;color:#1a73e8}
.inv-head span{margin-left:auto;font-weight:400;color:#888;font-size:12px}
.inv{display:flex;gap:12px;padding:12px;background:#fff}
.inv-foot{padding:7px 12px;border-top:1px solid #eee;font-size:12.5px;color:#188038}
.inv-date{flex:0 0 52px;height:62px;border-radius:8px;border:1px solid #d9d5cc;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.inv-date small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#c0392b}
.inv-date small+b+small{color:#666}
.inv-date b{font-size:24px;color:#222}
.inv-main{min-width:0;flex:1}
.inv-main p{margin:0 0 4px}
.inv-t{font-weight:600;font-size:16px;line-height:1.3}
.inv-time{font-size:14px;color:#444}
.inv-link{display:inline-flex;align-items:center;gap:8px;margin:6px 0 6px!important;background:#1a73e8;color:#fff;border-radius:16px;padding:5px 12px 5px 9px;font-size:14px;font-weight:600}
.inv-cam{width:18px;height:12px;background:#fff;border-radius:2px;position:relative;margin-right:4px}
.inv-cam::after{content:"";position:absolute;right:-6px;top:2px;border-left:6px solid #fff;border-top:4px solid transparent;border-bottom:4px solid transparent}
.inv-who{font-size:13px;color:#666}
.inv-rsvp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:#555}
.inv-rsvp span+span{border:1px solid #d9d5cc;border-radius:12px;padding:2px 10px}
.inv-rsvp span.on{background:#e8f0fe;border-color:#1a73e8;color:#1a73e8;font-weight:600}
/* ---------- copione ---------- */
.sp{background:#d3e3f1;color:#12161a;font-family:var(--mono);font-size:17px;line-height:1.45;padding:18px 16px 24px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.sp-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 10px;font-size:13.5px;border-bottom:1px solid #8aa2b8;padding-bottom:8px;margin-bottom:14px}
.sp-rev{background:#1f4f86;color:#e6eef7;padding:1px 7px;font-weight:700;letter-spacing:.06em}
.sp-note{display:block;text-align:right;margin:0 0 14px;transform:rotate(-3deg)}
.sp-slug{display:flex;justify-content:space-between;gap:8px;font-weight:700;text-transform:uppercase;margin:0 0 14px}
.sp-act{margin:0 0 16px}
.sp-cast{border:1px solid #8aa2b8;padding:8px 12px;margin:0 0 14px;font-size:15.5px}
.sp-cast-t{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#3d5670;margin-bottom:4px}
.sp-cast-r{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:3px 0;border-bottom:1px dotted #8aa2b8}
.sp-cast-r:last-child{border-bottom:0}
.sp-cast-r span:first-child{font-weight:700;text-transform:uppercase}
.sp-cast-r .hand{font-weight:400;text-transform:none}
.sp-line{margin:0 0 16px;padding-left:6%}
.sp-char{padding-left:22%;text-transform:uppercase;margin:0;font-weight:700}
.sp-paren{padding-left:14%;margin:0;font-style:italic}
.sp-dia{margin:0}
.strike{text-decoration:line-through;text-decoration-color:#b0231a;text-decoration-thickness:2px}
.hand{font-family:"Homemade Apple",cursive;color:#b0231a;font-size:17px;line-height:1.3}
.sp-margin{display:block;margin:-4px 0 12px;transform:rotate(-2deg)}
.sp-end{text-align:right;font-weight:700;text-transform:uppercase;margin-top:18px}
.sp-mark{margin-top:10px;font-size:14px;color:#3d5670;line-height:1.6}
.cstamp{display:inline-block;border:2px solid #b0231a;color:#b0231a;font-weight:700;letter-spacing:.12em;padding:2px 8px;transform:rotate(-4deg);font-size:13px;margin-bottom:6px}

/* ---------- assegno ---------- */
.chq{background:linear-gradient(160deg,#e3eee5,#f0e9d4 55%,#e2e9ef);color:#1f2a24;border-radius:6px;padding:16px 16px 14px;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.5);font-family:var(--serif);overflow:hidden}
.chq::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(40,90,70,.05) 0 2px,transparent 2px 7px),repeating-linear-gradient(-45deg,rgba(40,70,110,.05) 0 2px,transparent 2px 9px);pointer-events:none}
.chq > *{position:relative}
.chq-bank{font-family:"Old Standard TT",serif;font-weight:700;font-size:22px;line-height:1.15;color:#1d4a37}
.chq-bank small{display:block;font-family:var(--mono);font-weight:400;font-size:12.5px;letter-spacing:.04em;color:#4c6357;margin-top:3px}
.chq-amt{margin-top:12px;border:1.5px solid #1d4a37;background:rgba(255,255,255,.6);padding:6px 12px;font-family:var(--mono);font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.chq-amt .hand{font-size:20px}
.chq-f{margin-top:14px}
.chq-f span{display:block;font-size:14px;color:#3c5046}
.chq-f .fill{border-bottom:1px solid #58705f;padding:2px 2px 4px;min-height:34px}
.chq .hand{color:#1b2a6b;font-size:19px}
.chq-bottom{display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px;gap:12px;flex-wrap:wrap}
.chq-nt{border:2px solid #b0231a;color:#b0231a;font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.1em;padding:3px 8px;transform:rotate(-3deg)}
.chq-sign{text-align:center;font-size:13.5px;color:#3c5046;flex:1;min-width:170px}
.chq-sign .hand{font-size:24px;display:block;border-bottom:1px solid #58705f;padding-bottom:2px;margin-bottom:3px}
.chq-micr{margin-top:14px;font-family:var(--mono);letter-spacing:.12em;font-size:13px;color:#2b332f;word-break:break-all}

/* ---------- email ---------- */
.mail{background:#fbfaf7;color:#1c1c1c;border-radius:10px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);font-family:var(--sans);font-size:17px}
.mail-bar{background:#ecebe6;padding:10px 14px;font-size:14px;color:#555;border-bottom:1px solid #d8d6ce;font-weight:600}
.mail-h{padding:16px 16px 12px;border-bottom:1px solid #e5e3dc}
.mail-subj{font-size:21px;font-weight:700;margin:0 0 12px;line-height:1.25}
.mail-meta{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:15px;color:#555;line-height:1.4}
.mail-meta b{color:#1c1c1c;font-weight:600;word-break:break-word}
.mail-meta .when{font-variant-numeric:tabular-nums;color:#1c1c1c;font-weight:600}
.mail-b{padding:16px 16px 20px;line-height:1.6}
.mail-b p{margin:0 0 14px}
.mail-b .hl{background:#ffec9e;padding:0 3px;font-weight:600}
.mail-sig{color:#555;font-size:15px;border-top:1px solid #e5e3dc;padding-top:12px;margin-top:16px}

/* ---------- telefono ---------- */
.phone{width:100%;max-width:360px;margin:0 auto;background:linear-gradient(155deg,#3a3a3c,#0b0b0c 40%,#1c1c1e);border-radius:40px;padding:12px 10px 10px;box-shadow:0 30px 60px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.06)}
.ph-top{height:22px;display:flex;justify-content:center;align-items:center}
.ph-top i{width:56px;height:6px;border-radius:4px;background:#050505;display:block}
.ph-screen{position:relative;height:min(560px, calc(100svh - 230px));min-height:420px;border-radius:6px;overflow:hidden;background:#000;font-family:var(--sans);user-select:none;-webkit-user-select:none}
.ph-home{height:62px;display:grid;place-items:center}
.ph-home button{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a4a4c,#17171a 75%);border:1px solid #000;cursor:pointer;display:grid;place-items:center}
.ph-home button::before{content:"";width:17px;height:17px;border:1.5px solid #6b6b6d;border-radius:4px}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.sbar{flex:0 0 22px;background:#000;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;padding:0 9px}
.lockscr{background:radial-gradient(ellipse at 30% 20%,#2c3e63 0%,#16213e 40%,#0b0f21 75%,#060812 100%)}
.lk-time{text-align:center;color:#fff;margin-top:36px}
.lk-time .big{font-size:64px;font-weight:200;line-height:1.1}
.lk-time .dt{font-size:17px;opacity:.9}
.lk-notif{margin:24px 12px 0;background:rgba(255,255,255,.16);border-radius:14px;padding:11px 14px;color:#fff;font-size:16px}
.lk-notif b{display:block;font-size:13px;opacity:.8;font-weight:600;margin-bottom:2px}
.slide{margin:auto 16px 22px;height:52px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.4);border-radius:26px;position:relative;display:flex;align-items:center;overflow:hidden;cursor:pointer;touch-action:none}
.slide span{width:100%;text-align:center;padding-left:40px;color:#fff;font-size:17px;animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.knob{position:absolute;left:3px;top:3px;width:44px;height:44px;border-radius:50%;background:linear-gradient(180deg,#fff,#d8d8d8);display:grid;place-items:center;color:#555;font-size:20px}
/* whatsapp */
.wa{background:#fff;color:#111b21}
.wa-top{flex:0 0 auto;background:#fff;padding:8px 14px 6px;display:flex;align-items:center;justify-content:space-between}
.wa-top b{font-size:23px;font-weight:700;color:#1daa61;letter-spacing:-.01em}
.wa-ic{display:flex;gap:16px;color:#54656f}
.wa-ic svg{width:21px;height:21px}
.wa-search{margin:2px 12px 6px;background:#f0f2f5;border-radius:20px;padding:8px 14px;color:#667781;font-size:14.5px;display:flex;align-items:center;gap:8px}
.wa-search svg{width:16px;height:16px}
.wa-chips{display:flex;gap:6px;padding:0 12px 6px}
.wa-chips span{background:#f0f2f5;color:#54656f;border-radius:14px;padding:4px 11px;font-size:13px}
.wa-chips span.on{background:#d9fdd3;color:#15603e;font-weight:600}
.clist{flex:1;overflow-y:auto;background:#fff}
.crow{display:flex;align-items:center;gap:12px;padding:9px 14px;cursor:pointer;background:#fff;width:100%;text-align:left;border:0;font-family:inherit;color:inherit}
.crow:active{background:#f0f2f5}
.arow{display:flex;align-items:center;gap:14px;padding:10px 14px 10px 26px;cursor:pointer;background:#fff;width:100%;border:0;font-family:inherit;color:#111b21;font-size:16px;font-weight:600;text-align:left}
.arow svg{width:20px;height:20px;color:#1daa61;flex:0 0 20px}
.arow .lk{width:15px;height:15px;color:#667781}
.arow em{margin-left:auto;font-style:normal;font-size:13px;color:#1daa61;font-weight:600}
.av{flex:0 0 48px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:19px}
.cm{flex:1;min-width:0;border-bottom:1px solid #e9edef;padding-bottom:10px;margin-bottom:-10px}
.cm-t{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.cm-t b{font-size:16.5px;color:#111b21;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm-t span{font-size:12.5px;color:#667781;flex:0 0 auto}
.cm-t span.u{color:#1daa61;font-weight:600}
.cm-b{display:flex;align-items:center;gap:6px;margin-top:2px}
.cm-p{flex:1;font-size:14.5px;color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ubadge{flex:0 0 auto;min-width:20px;height:20px;border-radius:10px;background:#1daa61;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.tick{display:inline-block;width:16px;height:11px;vertical-align:-1px;margin-right:3px;color:#53bdeb}
.tick.g{color:#8696a0}
.wa-fab{position:absolute;right:14px;bottom:14px;width:52px;height:52px;border-radius:16px;background:#1daa61;display:grid;place-items:center;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.wa-fab svg{width:22px;height:22px}
.wa-hd{flex:0 0 auto;background:#fff;border-bottom:1px solid #e9edef;display:flex;align-items:center;gap:8px;padding:7px 10px 7px 4px;color:#111b21}
.wa-hd button{background:none;border:0;color:#111b21;cursor:pointer;padding:6px;display:grid;place-items:center}
.wa-hd button svg{width:22px;height:22px}
.wa-hd .av{flex:0 0 36px;width:36px;height:36px;font-size:15px}
.wa-hd .ttl{flex:1;min-width:0}
.wa-hd .ttl b{display:block;font-size:16.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-hd .ttl small{display:block;font-size:12.5px;color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-hd .ic{display:flex;gap:16px;color:#111b21;padding-right:4px}
.wa-hd .ic svg{width:20px;height:20px}
.tbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0 10px;background-color:#efeae2;background-image:radial-gradient(rgba(0,0,0,.035) 1.2px,transparent 1.3px),radial-gradient(rgba(0,0,0,.025) 1px,transparent 1.1px);background-size:22px 22px,15px 15px;background-position:0 0,7px 9px}
.dsep{display:table;margin:8px auto;background:#fff;color:#54656f;font-size:12.5px;padding:4px 10px;border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.syschip{display:table;margin:6px auto 10px;max-width:84%;background:#fff5c4;color:#54656f;font-size:12.5px;padding:5px 10px;border-radius:8px;text-align:center;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.mrow{display:flex;margin:2px 10px}
.mrow.out{justify-content:flex-end}
.mrow.first{margin-top:8px}
.bub{position:relative;max-width:80%;padding:6px 9px 8px 9px;border-radius:8px;font-size:15.5px;line-height:1.33;box-shadow:0 1px .5px rgba(11,20,26,.13);color:#111b21}
.bub.out{background:#d9fdd3}
.bub.in{background:#fff}
.mrow.first .bub.out{border-top-right-radius:0}
.mrow.first .bub.in{border-top-left-radius:0}
.bub .mtm{float:right;margin:6px 0 -4px 10px;font-size:11px;color:#667781;line-height:1;white-space:nowrap}
.bub .mtm .tick{width:15px;height:10px;margin:0 0 0 3px;vertical-align:-1px}
.wa-in{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 8px 8px;background:#efeae2}
.wa-in span{flex:1;background:#fff;border-radius:22px;padding:10px 14px;color:#8696a0;font-size:15px;display:flex;align-items:center;gap:10px}
.wa-in span svg{width:19px;height:19px;color:#54656f}
.wa-in i{flex:0 0 44px;width:44px;height:44px;border-radius:50%;background:#1daa61;display:grid;place-items:center;color:#fff}
.wa-in i svg{width:20px;height:20px}
.pinscr{background:#fff;align-items:center;color:#111b21;overflow-y:auto;padding-bottom:16px}
.pin-cancel{position:absolute;left:4px;top:6px;color:#1daa61;font-size:16px;font-weight:600;background:none;border:0;cursor:pointer;padding:8px 10px}
.pin-lock{flex:0 0 auto;margin-top:44px;width:54px;height:54px;border-radius:50%;background:#d9fdd3;display:grid;place-items:center;color:#1daa61}
.pin-lock svg{width:26px;height:26px}
.pin-t{font-size:19px;font-weight:600;margin-top:12px}
.pin-s{color:#667781;font-size:14px;margin-top:6px;text-align:center;padding:0 26px;line-height:1.4}
.pdots{display:flex;gap:18px;margin:16px 0 6px}
.pdots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #8696a0;display:block}
.pdots i.f{background:#1daa61;border-color:#1daa61}
.shake{animation:shake .4s}
@keyframes shake{20%,80%{transform:translateX(6px)}40%,60%{transform:translateX(-8px)}}
.perr{color:#d93025;font-size:14px;height:18px;margin-bottom:4px}
.pkeys{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,58px);gap:8px 20px}
.pk{width:58px;height:58px;border-radius:50%;background:#f0f2f5;color:#111b21;font-size:26px;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-family:inherit}
.pk:active{background:#d9fdd3}
.pk small{font-size:8.5px;letter-spacing:2px;color:#667781;margin-top:3px}
.pk.e{visibility:hidden}
.sbar.lt{background:#fff;color:#111b21}
.wa-box{max-width:420px;margin:0 auto;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.wa-box .ph-screen{border-radius:0;background:#fff;height:min(640px, calc(100svh - 120px));min-height:520px}
.wa-box .wa-top{padding-top:12px}
.pinscr .sbar{align-self:stretch}

/* ---------- rullino ---------- */
.cam{background:linear-gradient(160deg,#d9dbde,#8b8e93 30%,#3a3c40 70%,#1c1d1f);border-radius:16px;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.55)}
.cam-top{display:flex;justify-content:space-between;align-items:center;padding:0 4px 10px}
.cam-brand{font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:3px;color:#34363a}
.cam-brand small{display:block;font-size:9px;letter-spacing:2px;font-weight:600;color:#5d6166}
.cam-rec{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b7bac0 55%,#7d8085)}
.lcd{background:#0a1210;border-radius:6px;padding:6px;box-shadow:inset 0 0 0 2px #000}
.lcd-osd{display:flex;justify-content:space-between;font-family:var(--mono);font-size:14px;font-weight:700;color:#e9fff4;padding:2px 4px 6px}
.roll-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.thumb{position:relative;aspect-ratio:4/3;border:0;padding:0;background:#15201d;cursor:pointer;overflow:hidden;border-radius:2px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .tt{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);color:#ffb35a;font-family:var(--mono);font-weight:700;font-size:13px;padding:2px 4px;text-align:left}
.thumb.bad{background:repeating-linear-gradient(135deg,#141a19 0 5px,#1a2220 5px 10px);color:#ff7b6b;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;text-align:center;line-height:1.2}
.single{position:relative;background:#000;border-radius:3px;overflow:hidden}
.single img{display:block;width:100%;height:auto}
.single .bigbad{aspect-ratio:4/3;display:grid;place-items:center;text-align:center;color:#ff7b6b;font-family:var(--mono);font-weight:700;font-size:16px;padding:20px;background:repeating-linear-gradient(135deg,#141a19 0 8px,#1a2220 8px 16px)}
.single .bigbad small{display:block;color:#b8c8c3;font-weight:400;font-size:14px;margin-top:6px}
.stamp{position:absolute;right:4%;bottom:5%;font-family:var(--mono);font-weight:700;color:#ff9a2e;font-size:22px;letter-spacing:.06em;text-shadow:0 0 6px rgba(255,120,20,.6),0 0 2px #000}
.roll-nav{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:8px;margin-top:10px}
.rbtn{height:52px;border-radius:10px;border:0;background:linear-gradient(180deg,#5b5e63,#2f3033);color:#fff;font-size:26px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.rbtn.wide{font-family:var(--mono);font-size:15px;font-weight:700}
.roll-cap{text-align:center;font-family:var(--mono);color:#f3ebdd;font-size:15px;line-height:1.35}
.roll-cap b{display:block;color:var(--amber);font-size:17px}

/* ---------- admin ---------- */
.sheet{max-width:480px;margin:0 auto;background:var(--bg2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sheet-h{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-h h4{margin:0;font-family:var(--display);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.04em;line-height:1}
.sheet-h p{margin:6px 0 0;font-family:var(--mono);font-size:15px;color:var(--muted)}
.adm-sc{padding:12px 16px 6px;border-bottom:1px solid var(--line)}
.adm-sc-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.adm-sc-h b{font-family:var(--display);font-weight:800;font-size:21px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.adm-sc-h b span{color:var(--amber)}
.linkbtn{background:none;border:0;color:var(--amber);font-family:var(--mono);font-size:15px;font-weight:700;cursor:pointer;padding:10px 0;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.adm-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.adm-row .nm{flex:1;min-width:0}
.adm-row .nm b{display:block;font-weight:600;font-size:17px;line-height:1.3}
.adm-row .nm small{font-family:var(--mono);font-size:13px;color:var(--faint)}
.adm-row .chg{color:var(--amber)}
.sw{position:relative;width:56px;height:32px;flex:0 0 56px;border-radius:16px;background:var(--bg3);border:1px solid var(--line);cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--faint);transition:all .15s}
.sw[aria-checked="true"]{background:#3b5f33;border-color:#5f8a52}
.sw[aria-checked="true"]::after{left:27px;background:#e6f2df}
.adm-foot{padding:14px 16px 18px;display:grid;gap:10px}
.btn{border-radius:6px;padding:14px 16px;cursor:pointer;font-family:var(--mono);font-weight:700;font-size:16px;border:1px solid var(--line);background:var(--bg3);color:var(--text);width:100%}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1208}
.btn:disabled{opacity:.45;cursor:not-allowed}
.adm-msg{font-family:var(--mono);font-size:15px;color:var(--muted);min-height:20px;line-height:1.45}
.adm-msg.err{color:#f59a8f}
.adm-msg.ok{color:#a7d993}
.codebox{max-width:340px;margin:6vh auto 0;text-align:center}
.codebox h4{font-family:var(--display);font-weight:800;font-size:30px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px}
.codebox p{font-family:var(--mono);font-size:15px;color:var(--muted);margin:0 0 20px}
.cdots{display:flex;justify-content:center;gap:16px;margin-bottom:8px}
.cdots i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--faint);display:block}
.cdots i.f{background:var(--amber);border-color:var(--amber)}
.cerr{height:20px;font-family:var(--mono);font-size:15px;color:#f59a8f;margin-bottom:12px}
.ckeys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:290px;margin:0 auto}
.ck{height:64px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);font-family:var(--display);font-weight:800;font-size:28px;cursor:pointer;color:var(--text)}
.ck:active{background:var(--bg3)}
.ck.e{visibility:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- menu in basso ---------- */
body{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;top:0;z-index:45;background:rgba(20,17,14,.97);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px}
.tabbar-in{max-width:480px;margin:0 auto;padding-right:56px;display:flex;gap:8px}
.tabb{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;color:var(--muted);font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;position:relative}
.tabb svg{width:21px;height:21px}
.tabb.on{background:var(--amber);border-color:var(--amber);color:#1a1208}
.tdot{position:absolute;top:6px;right:14px;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg2)}
.tabb.on .tdot{box-shadow:0 0 0 2px var(--amber)}

/* ---------- cast ---------- */
.cast-h{}
.castlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cp{display:flex;align-items:center;gap:16px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.cp-photo{position:relative;flex:0 0 84px;width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--bg3);border:2px solid var(--amber-dim);display:grid;place-items:center}
.cp-photo span{font-family:var(--display);font-weight:800;font-size:30px;color:var(--muted);letter-spacing:.04em}
.cp-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cp-txt{min-width:0}
.cp-txt b{display:block;font-family:var(--display);font-weight:800;font-size:27px;line-height:1;text-transform:uppercase;letter-spacing:.03em}
.cp-txt i{display:block;margin-top:6px;font-family:var(--mono);font-style:normal;font-size:15px;font-weight:700;color:var(--amber);letter-spacing:.03em;text-transform:uppercase;line-height:1.3}
</style>

function sdkBad(i){
  var v=sdkCur[i]; if(v==="0") return false;
  var r=Math.floor(i/9), c=i%9, br=r-r%3, bc=c-c%3;
  for(var k=0;k<81;k++){ if(k===i||sdkCur[k]!==v) continue;
    var kr=Math.floor(k/9), kc=k%9;
    if(kr===r||kc===c||(kr-kr%3===br&&kc-kc%3===bc)) return true; }
  return false;
}
function sdkDraw(){
  var g=document.getElementById("sdk"); if(!g) return;
  var sr=sdkSel>=0?Math.floor(sdkSel/9):-9, sc=sdkSel>=0?sdkSel%9:-9;
  var h="";
  for(var i=0;i<81;i++){
    var r=Math.floor(i/9), c=i%9, giv=SDK_PUZ[i]!=="0", hi=SDK_HL.indexOf(i);
    var cls=[]; if(giv) cls.push("g"); if(hi>=0) cls.push("h");
    if(i===sdkSel) cls.push("sel"); else if(sdkSel>=0 && (r===sr||c===sc||(r-r%3===sr-sr%3&&c-c%3===sc-sc%3))) cls.push("peer");
    if(!giv && sdkBad(i)) cls.push("bad");
    h+='<button type="button" data-i="'+i+'" class="'+cls.join(" ")+'" aria-label="Riga '+(r+1)+' colonna '+(c+1)+'">'+(hi>=0?'<sup>'+(hi+1)+'</sup>':'')+(sdkCur[i]!=="0"?sdkCur[i]:'')+'</button>';
  }
  g.innerHTML=h;
  g.querySelectorAll("button").forEach(function(b){ b.onclick=function(){ var i=+b.getAttribute("data-i"); if(SDK_PUZ[i]!=="0") { sdkSel=-1; } else { sdkSel=(sdkSel===i?-1:i); } sdkDraw(); }; });
  var msg=document.getElementById("sdkMsg");
  if(msg){ msg.textContent = sdkCur.join("")===SDK_SOL ? "Sudoku risolto! Ora leggete le cifre nelle caselle evidenziate." : (sdkSel<0 && sdkCur.indexOf("0")>=0 ? "Tocca una casella vuota, poi scegli il numero." : ""); }
}
function sdkInit(){
  sdkSel=-1; sdkDraw();
  document.querySelectorAll("#sdkPad button").forEach(function(b){ b.onclick=function(){
    if(sdkSel<0) return;
    sdkCur[sdkSel]=b.getAttribute("data-n");
    sset("sessionStorage","ucp-sdk",sdkCur.join(""));
    sdkDraw();
  }; });
}

var rollIdx = -1;
function rollRender(){
  var lcd = document.getElementById("lcd"); if(!lcd) return;
  var n = ROLL.length;
  if(rollIdx < 0){
    lcd.innerHTML = '<div class="lcd-osd"><span>INDICE</span><span>'+n+' FOTO</span></div><div class="roll-grid">'+
      ROLL.map(function(p,i){
        var src = PHOTOS[p.img];

      }).join("")+'</div>'+
      '<div class="roll-cap" style="margin-top:12px">Tocca uno scatto per aprirlo</div>';
    lcd.querySelectorAll("[data-i]").forEach(function(b){ b.onclick=function(){ rollIdx=+b.getAttribute("data-i"); rollRender(); }; });
    return;
  }
  var p = ROLL[rollIdx], src = PHOTOS[p.img];
  lcd.innerHTML = '<div class="lcd-osd"><span>'+p.file+'</span><span>'+(rollIdx+1)+' / '+n+'</span></div>'+
    '<div class="single" id="single">'+(src
      ? '<img alt="'+esc(p.label)+(p.time?', ore '+p.time:'')+'" src="'+src+'">'+(p.time?'<span class="stamp">'+p.time+'</span>':'')
      : '<div class="bigbad">FILE DANNEGGIATO<small>Impossibile visualizzare lo scatto</small></div>')+'</div>'+
    '<div class="roll-nav"><button type="button" class="rbtn" id="rPrev" aria-label="Foto precedente">‹</button>'+
    '<div class="roll-cap"><b>'+esc(p.label)+'</b>'+(p.time?'ore '+p.time:'orario illeggibile')+'</div>'+
    '<button type="button" class="rbtn" id="rNext" aria-label="Foto successiva">›</button></div>'+
    '<div class="roll-nav" style="grid-template-columns:1fr"><button type="button" class="rbtn wide" id="rGrid">▦ Tutte le foto</button></div>';
  document.getElementById("rPrev").onclick=function(){ rollIdx=(rollIdx-1+n)%n; rollRender(); };
  document.getElementById("rNext").onclick=function(){ rollIdx=(rollIdx+1)%n; rollRender(); };
  document.getElementById("rGrid").onclick=function(){ rollIdx=-1; rollRender(); };
  var sg=document.getElementById("single"), x0=null, y0=null;
  sg.addEventListener("touchstart",function(e){ if(e.touches.length!==1){ x0=null; return; } x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  sg.addEventListener("touchend",function(e){ if(x0===null) return; var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5){ rollIdx=(rollIdx+(dx<0?1:-1)+n)%n; rollRender(); } },{passive:true});
}

function bindSlide(){
  var s=document.getElementById("slide"), k=document.getElementById("knob");
  var drag=false, sx=0, x=0;
  function max(){ return s.clientWidth - k.clientWidth - 6; }
  function set(v){ x=Math.max(0,Math.min(max(),v)); k.style.left=(3+x)+"px"; }
  function done(){ phRender("list"); }
  k.addEventListener("pointerdown",function(e){ drag=true; sx=e.clientX-x; try{k.setPointerCapture(e.pointerId);}catch(_){} e.stopPropagation(); });
  k.addEventListener("pointermove",function(e){ if(!drag) return; set(e.clientX-sx); if(x>=max()-2){ drag=false; done(); } });
  k.addEventListener("pointerup",function(){ if(!drag) return; drag=false; if(x<max()-2) set(0); });
  s.addEventListener("click",function(e){ if(e.target===k) return; var v=x; (function step(){ v+=18; set(v); if(v<max()) setTimeout(step,14); else done(); })(); });
  s.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); done(); } });
}

function drawAdmin(msg, cls){
  var n = changes();
  var h = '<div class="modal-bar" style="justify-content:flex-end"><button type="button" class="xbtn" id="xbtn" aria-label="Chiudi">×</button></div>';
  h += '<div class="sheet"><div class="sheet-h"><div><h4>Regia reperti</h4><p>Visibili ai tavoli: '+STATE.visible.length+' di '+ORDER.length+'</p></div>'+
       '<button type="button" class="linkbtn" id="logout">Esci</button></div>';
  SCENES.forEach(function(s){
    if(!s.clues.length) return;
    var allOn = s.clues.every(function(id){ return draft.indexOf(id)>=0; });
    h += '<div class="adm-sc"><div class="adm-sc-h"><b><span>'+s.n+'</span> · '+esc(s.title)+'</b><button type="button" class="linkbtn" data-scene="'+s.n+'">'+(allOn?'Nascondi tutti':'Mostra tutti')+'</button></div>';
    s.clues.forEach(function(id){
      var on = draft.indexOf(id)>=0, chg = on !== isVis(id);
      h += '<div class="adm-row"><button type="button" class="sw" role="switch" aria-checked="'+on+'" data-sw="'+id+'" aria-label="'+esc(CLUES[id].title)+'"></button>'+
        '<div class="nm"><b>'+esc(CLUES[id].title)+'</b><small>'+tag(id)+(chg?' · <span class="chg">da salvare</span>':'')+'</small></div>'+
        '<button type="button" class="linkbtn" data-peek="'+id+'">Anteprima</button></div>';
    });
    h += '</div>';
  });
  h += '<div class="adm-foot"><button type="button" class="btn primary" id="pub"'+(n?'':' disabled')+'>Salva e mostra'+(n?' ('+n+')':'')+'</button>'+
       '<button type="button" class="btn" id="undo"'+(n?'':' disabled')+'>Annulla modifiche</button>'+
       '<button type="button" class="btn" id="hideall">Nascondi tutto</button>'+
       '<div class="adm-msg '+(cls||'')+'" id="amsg">'+(msg||'Le modifiche diventano visibili dopo “Salva e mostra”.')+'</div></div></div>';
  showModal(h);
  document.getElementById("xbtn").onclick = closeModal;
  document.getElementById("logout").onclick = function(){ adminOn=false; sdel("sessionStorage","ucp-admin"); closeModal(); renderPage(); };
  modal.querySelectorAll("[data-sw]").forEach(function(b){ b.onclick=function(){
    var id=b.getAttribute("data-sw"), i=draft.indexOf(id);
    if(i>=0) draft.splice(i,1); else draft.push(id);
    drawAdmin();
  }; });
  modal.querySelectorAll("[data-scene]").forEach(function(b){ b.onclick=function(){
    var s = SCENES.filter(function(x){ return String(x.n)===b.getAttribute("data-scene"); })[0];
    var allOn = s.clues.every(function(id){ return draft.indexOf(id)>=0; });
    s.clues.forEach(function(id){ var i=draft.indexOf(id); if(allOn && i>=0) draft.splice(i,1); if(!allOn && i<0) draft.push(id); });
    drawAdmin();
  }; });
  modal.querySelectorAll("[data-peek]").forEach(function(b){ b.onclick=function(){
    var keep = draft.slice(); openClue(b.getAttribute("data-peek"));
    var x=document.getElementById("xbtn"); x.onclick=function(){ draft=keep; drawAdmin(); };
  }; });
  document.getElementById("undo").onclick = function(){ draft = STATE.visible.slice(); drawAdmin(); };
  document.getElementById("hideall").onclick = function(){ draft = []; drawAdmin(); };
  document.getElementById("pub").onclick = publish;
}

function saveLocal(vis){ try{ localStorage.setItem("ucp-stato-v2", JSON.stringify({visible:vis, t:Date.now()})); }catch(e){} }
function applyState(vis){
  var a = STATE.visible.slice().sort().join(), b = vis.slice().sort().join();
  if(a===b) return;
  STATE.visible = vis.slice();
  var adminOpen = modal && !modal.hidden && modal.querySelector(".sheet");
  var otherOpen = modal && !modal.hidden && !adminOpen;
  if(otherOpen) return; /* non disturbare chi sta esaminando un reperto */
  renderPage(); if(adminOpen){ drawAdmin(); }
}
/* altre schede dello stesso dispositivo (es. proiettore) */
window.addEventListener("storage", function(e){
  if(e.key!=="ucp-stato-v2") return;
  try{ var s=JSON.parse(e.newValue||"null"); if(s && Array.isArray(s.visible)) applyState(s.visible); }catch(_){}
});
/* sincronizzazione online opzionale */
function pull(){
  if(!REMOTE_URL) return;
  fetch(REMOTE_URL,{cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; })
    .then(function(s){ if(s && Array.isArray(s.visible)){ saveLocal(s.visible); applyState(s.visible); } }).catch(function(){});
}
if(REMOTE_URL){ pull(); setInterval(pull, 8000); }

function publish(){
  var next = ORDER.filter(function(id){ return draft.indexOf(id)>=0; });
  STATE.visible = next; saveLocal(next);
  renderPage();
  if(!REMOTE_URL){ drawAdmin("Salvato. Reperti aggiornati su questo dispositivo.","ok"); return; }
  fetch(REMOTE_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:sget("sessionStorage","ucp-code")||"",visible:next})})
    .then(function(r){ drawAdmin(r.ok ? "Salvato e inviato a tutti i tavoli." : (r.status===403 ? "Codice non valido: esci e rientra con il codice corretto." : "Salvato qui, ma l\u2019invio online non è riuscito ("+r.status+")."), r.ok?"ok":"err"); })
    .catch(function(){ drawAdmin("Salvato qui, ma il server non risponde: i tavoli non l\u2019hanno ancora ricevuto.","err"); });
}

renderPage();
})();
</script>
</body>
</html>
